name: ablegroupdevelopers
services:
  - name: web
    github:
      branch: main
      deploy_on_push: true
    source_dir: /src # Only if package.json is in src/
    build_command: |
      npm ci --no-audit --prefer-offline
      npm run build
    run_command: npm start
    environment_slug: node-js
    http_port: 3000
    instance_size_slug: professional-xs
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        value: production